name: Pulsar Brain
version: "0.3.0"
slug: pulsar_brain
description: "Голосовой ассистент для Яндекс Станции с прошивкой pulsar: STT, LLM, инструменты, MCP, планировщик и веб-интерфейс"
url: https://github.com/Thedamem/pulsar-brain
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
# UI is reachable through Home Assistant ingress. The port below is optional: enable it in
# the app's Network settings together with access_token when the API must be reached from
# the LAN (debugging or an external agent).
ingress: true
ingress_port: 8097
panel_title: Pulsar Brain
panel_icon: mdi:account-voice
panel_admin: true
ports:
  8097/tcp: null
ports_description:
  8097/tcp: "API и веб-интерфейс снаружи ingress (нужен access_token)"
homeassistant_api: true
# Supervisor discovery and /addons/self/info are available without hassio_api.
watchdog: http://[HOST]:[PORT:8097]/health
# Integrations that receive this addon's Supervisor discovery payload.
discovery:
  - pulsar_brain
# SQLite (sessions, schedules) is not safe to copy while running.
backup: cold
options:
  log_level: info
  access_token: ""
  auto_detect: true
schema:
  log_level: list(trace|debug|info|warn|error)
  access_token: password
  auto_detect: bool
