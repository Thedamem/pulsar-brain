# Minimal Home Assistant Core configuration for the pulsar-brain dev stand.
# The template entities below are the test devices for addon tools and e2e runs:
# light.kitchen, switch.tv, media_player.speaker (backed by input helpers).
# Runtime state stays out of git; only this configuration.yaml is tracked for reproducibility.
default_config:

homeassistant:
  name: Pulsar Dev
  country: RU
  language: ru
  time_zone: Europe/Moscow
  unit_system: metric

logger:
  default: warning
  logs:
    homeassistant.components.onboarding: info
    custom_components.pulsar_brain: debug

http:
  server_port: 8123
  ip_ban_enabled: false
  login_attempts_threshold: -1

input_boolean:
  kitchen_light:
    name: kitchen light
  tv_power:
    name: tv power
  speaker_power:
    name: speaker power

input_number:
  speaker_volume:
    name: speaker volume
    min: 0
    max: 1
    step: 0.05
    initial: 0.35

template:
  - light:
      - name: kitchen
        unique_id: pulsar_dev_kitchen_light
        state: "{{ is_state('input_boolean.kitchen_light', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.kitchen_light
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.kitchen_light
  - switch:
      - name: tv
        unique_id: pulsar_dev_tv
        state: "{{ is_state('input_boolean.tv_power', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.tv_power
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.tv_power
  - media_player:
      - name: speaker
        unique_id: pulsar_dev_speaker
        state: "{{ 'playing' if is_state('input_boolean.speaker_power', 'on') else 'idle' }}"
        volume_level: "{{ states('input_number.speaker_volume') | float(0.35) }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.speaker_power
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.speaker_power
        volume_set:
          - action: input_number.set_value
            target:
              entity_id: input_number.speaker_volume
            data:
              value: "{{ volume_level }}"
