name: Pulsar Brain
version: "0.1.0"
slug: pulsar_brain
description: "Голосовой ассистент для Яндекс Станции с прошивкой pulsar: STT, LLM, инструменты, MCP, планировщик и веб-интерфейс"
url: https://github.com/Thedamem/pulsar-brain
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
# UI is reachable only through Home Assistant ingress. No ports are published:
# the Python bridge talks to the app over the internal Supervisor network.
ingress: true
ingress_port: 8097
panel_title: Pulsar Brain
panel_icon: mdi:account-voice
panel_admin: true
homeassistant_api: true
hassio_api: true
hassio_role: default
watchdog: http://[HOST]:[PORT:8097]/health
# SQLite (sessions, schedules) is not safe to copy while running.
backup: cold
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|warn|error)
